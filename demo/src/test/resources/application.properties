spring.application.name=demo
spring.main.banner-mode=off

spring.datasource.url=jdbc:h2:mem:sst_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789abcdef
jwt.expiration=3600000

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

app.seed.enabled=false
app.uploads.dir=${java.io.tmpdir}/sst-test-uploads
app.cors.allowed-origins=http://localhost:4200
app.admin.username=
app.admin.password=

logging.level.root=WARN
logging.level.com.example.demo=INFO
