spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sst_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:sst_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.seed.enabled=true
springdoc.api-docs.enabled=true
